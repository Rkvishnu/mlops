# MLflow tracking server (model registry). Optional.
# Start: docker compose -f docker-compose.mlflow.yml up -d
# UI: http://localhost:5000
# Point train.py at it: export MLFLOW_TRACKING_URI=http://localhost:5000
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.10.0
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --serve-artifacts --default-artifact-root mlflow-artifacts:/ --artifacts-destination /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow

volumes:
  mlflow-data:
